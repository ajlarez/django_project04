{% extends 'includes/navbar.html' %}

{% block content %}
<style>
    :root {
        --primary-color: #4361ee;
        --primary-light: #eef2ff;
        --secondary-color: #3a0ca3;
        --danger-color: #e63946;
        --light-color: #f8f9fa;
        --dark-color: #212529;
        --gray-light: #e9ecef;
        --gray-medium: #6c757d;
        --border-radius: 8px;
        --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
    }

    .form-container {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2.5rem;
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Estilos para los campos generados por form.as_p */
    form p {
        margin-bottom: 1.8rem;
        position: relative;
    }

    form label {
        display: block;
        margin-bottom: 0.6rem;
        color: var(--dark-color);
        font-weight: 500;
        font-size: 0.95rem;
    }

    form input:not([type="submit"]):not([type="checkbox"]):not([type="file"]),
    form textarea,
    form select {
        width: 100%;
        padding: 0.9rem 1.2rem;
        border: 1px solid var(--gray-light);
        border-radius: var(--border-radius);
        font-size: 1rem;
        transition: var(--transition);
        background-color: var(--light-color);
    }

    /* Estilo especial para campos de archivo */
    form input[type="file"] {
        width: 100%;
        padding: 0.7rem;
        border: 1px dashed var(--gray-medium);
        border-radius: var(--border-radius);
        background-color: var(--primary-light);
    }

    /* Estilo para checkboxes */
    form input[type="checkbox"] {
        margin-right: 0.5rem;
        transform: scale(1.2);
    }

    form textarea {
        min-height: 120px;
        resize: vertical;
    }

    form input:focus:not([type="submit"]):not([type="file"]),
    form textarea:focus,
    form select:focus {
        border-color: var(--primary-color);
        outline: none;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        background-color: white;
    }

    /* Estilo para el botón de submit */
    form button[type="submit"] {
        background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: var(--border-radius);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        display: block;
        margin: 2.5rem auto 0;
        width: 100%;
        max-width: 200px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    form button[type="submit"]:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(67, 97, 238, 0.3);
    }

    /* Mensajes de error y ayuda */
    .errorlist {
        list-style: none;
        color: var(--danger-color);
        font-size: 0.85rem;
        margin-top: 0.5rem;
    }

    .helptext {
        display: block;
        font-size: 0.8rem;
        color: var(--gray-medium);
        margin-top: 0.4rem;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .form-container {
            margin: 1.5rem;
            padding: 1.8rem;
        }
    }

    @media (max-width: 480px) {
        .form-container {
            margin: 1rem;
            padding: 1.5rem;
        }
        
        form button[type="submit"] {
            width: 100%;
            max-width: none;
        }
    }
</style>

<div class="form-container">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Enviar</button>
    </form>
</div>

{% endblock %}
