
{% extends 'includes/navbar.html' %}

{% block content %}
<style>
    :root {
        --primary-color: #4361ee;
        --secondary-color: #3a0ca3;
        --accent-color: #f72585;
        --light-color: #f8f9fa;
        --dark-color: #212529;
        --gray-color: #6c757d;
        --border-radius: 8px;
        --box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
    }

    .form-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
    }

    .form-title {
        color: var(--dark-color);
        text-align: center;
        margin-bottom: 2rem;
        font-weight: 600;
        position: relative;
        padding-bottom: 0.5rem;
    }

    .form-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background: var(--accent-color);
    }

    /* Estilos para los campos del formulario */
    form p {
        margin-bottom: 1.5rem;
    }

    form label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--dark-color);
        font-weight: 500;
    }

    form input:not([type="submit"]),
    form textarea,
    form select,
    form .file-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #ddd;
        border-radius: var(--border-radius);
        font-size: 1rem;
        transition: var(--transition);
    }

    form input:focus:not([type="submit"]),
    form textarea:focus,
    form select:focus {
        border-color: var(--primary-color);
        outline: none;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
    }

    /* Estilo especial para campos de archivo */
    form .file-input {
        padding: 0.5rem;
        border: 1px dashed var(--gray-color);
        background-color: #f9f9f9;
    }

    /* Estilo para el botón de submit */
    form input[type="submit"] {
        background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: var(--border-radius);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        display: block;
        margin: 2rem auto 0;
        min-width: 150px;
    }

    form input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
    }

    /* Mensajes de ayuda y error */
    .helptext {
        font-size: 0.8rem;
        color: var(--gray-color);
        display: block;
        margin-top: 0.3rem;
    }

    .errorlist {
        list-style: none;
        color: #dc3545;
        font-size: 0.8rem;
        margin-top: 0.3rem;
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .form-container {
            margin: 1rem;
            padding: 1.5rem;
        }
    }

    @media (max-width: 576px) {
        .form-container {
            margin: 0.5rem;
            padding: 1rem;
        }
        
        .form-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
    }
</style>

<div class="form-container">
    <h1 class="form-title">Crear Nuevo Elemento</h1>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Crear">
    </form>
</div>

{% endblock %}
